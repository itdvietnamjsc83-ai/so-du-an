[package]
name = "so-du-an"
version = "0.1.1"
description = "Sổ Dự Án - quản lý dự án offline"
edition = "2021"
default-run = "so-du-an"

[lib]
name = "so_du_an_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "so-du-an"
path = "src/main.rs"

[[bin]]
name = "sda-keygen"
path = "src/bin/sda-keygen.rs"
required-features = ["keygen"]

[features]
# Công cụ cấp key của nhà cung cấp, không đưa vào bộ cài.
keygen = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
data-encoding = "2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
machine-uid = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
