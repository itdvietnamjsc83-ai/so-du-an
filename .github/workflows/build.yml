name: Build bộ cài

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --bundles nsis
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Kiểm tra lõi Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Xóa bộ cài cũ cùng phiên bản trên bản phát hành (để thay bằng bản mới)
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${{ matrix.name }}" = windows ]; then pat='[.]exe$'; else pat='[.](dmg|tar[.]gz|sig)$'; fi
          gh release view "v$v" --json assets --jq '.assets[].name' 2>/dev/null | grep -E "$pat" | while read -r f; do gh release delete-asset "v$v" "$f" -y; done || true
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Mỗi lần đẩy lên main: cập nhật bản phát hành theo số phiên bản trong tauri.conf.json.
          tagName: ${{ github.event_name == 'push' && 'v__VERSION__' || '' }}
          releaseName: 'Sổ Dự Án v__VERSION__'
          releaseBody: 'Windows: tải tệp .exe. macOS: tải tệp .dmg.'
          releaseDraft: false
      - uses: actions/upload-artifact@v4
        with:
          name: SoDuAn-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
